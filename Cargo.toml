[package]
name = "culinetics"
version = "0.1.0"
authors = ["Hendric Eckelt <hendric.eckelt@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.2", features = ["router"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"

[features]
default = ["web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]
